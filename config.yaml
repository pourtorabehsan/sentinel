# Sentinel Configuration File
# This is the main configuration for Sentinel

# Operational mode: multi (multiple clusters) or single (single cluster)
mode: multi

# Log level: debug, info, warn, error
log_level: info

# State store configuration
# The state store persists cluster topology and state information
state_store:
  # Type: mysql, postgresql, or sqlite
  type: sqlite

  # Data Source Name (DSN)
  # For SQLite:
  #   - ":memory:" for in-memory database (development/testing)
  #   - "file:sentinel.db" for persistent file
  # For MySQL:
  #   - "user:password@tcp(host:port)/database"
  # For PostgreSQL:
  #   - "postgres://user:password@host:port/database"
  dsn: "file:sentinel.db"

# Leader election configuration
# Leader election ensures only one Sentinel instance manages each cluster
leader_election:
  # Backend: etcd, consul, zookeeper, database, or in-memory
  backend: in-memory

  # Endpoints for the leader election backend
  # Not required for in-memory backend (development/testing only)
  endpoints: []

  # For production with etcd:
  # backend: etcd
  # endpoints:
  #   - "http://etcd1:2379"
  #   - "http://etcd2:2379"
  #   - "http://etcd3:2379"

# API server configuration
api:
  enabled: true
  port: 8080

# Monitoring configuration
monitor:
  enabled: true
  interval_seconds: 10

# NOTE: Groups and clusters are NOT defined in this config file.
# They are managed in the database via:
# - CLI commands: sentinel discover --cluster-id=... --seed=...
# - API endpoints (Phase 5+): POST /api/v1/groups, POST /api/v1/clusters
