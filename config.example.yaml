# Sentinel Configuration File - Example
# Copy this file to config.yaml and customize for your environment

# Operational mode: multi (multiple clusters) or single (single cluster)
mode: multi

# Log level: debug, info, warn, error
log_level: info

# State store configuration
state_store:
  # For development with SQLite
  type: sqlite
  dsn: "file:sentinel.db"

  # For production with MySQL
  # type: mysql
  # dsn: "sentinel_user:password@tcp(mysql-host:3306)/sentinel"

  # For production with PostgreSQL
  # type: postgresql
  # dsn: "postgres://sentinel_user:password@postgres-host:5432/sentinel?sslmode=require"

# Leader election configuration
leader_election:
  # For development
  backend: in-memory
  endpoints: []

  # For production with etcd
  # backend: etcd
  # endpoints:
  #   - "http://etcd1:2379"
  #   - "http://etcd2:2379"
  #   - "http://etcd3:2379"

# API server configuration
api:
  enabled: true
  port: 8080

# Monitoring configuration
monitor:
  enabled: true
  interval_seconds: 10
